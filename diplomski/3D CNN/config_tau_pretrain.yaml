# =============================================================================
# Konfiguracija za TAU-106K pre-trening 3D CNN backbonea
#
# Cilj: pre-trenirati R(2+1)D-18 backbone na 9253 TAU-106K klipova
#   (4× više podataka od DoTA → backbone nauči generalne prometne uzorke)
# Zatim fine-tune na DoTA s config_3d.yaml + pretrained_backbone: <path>
#
# Razlike od DoTA config-a:
#   - frames_root: tau106k_eval/frames_224 (frames sa /images/ subfolderom)
#   - use_object_branch: true (YOLO detekcije dostupne)
#   - batch_size: 64 (više podataka, manji model → možemo veći batch)
#   - learning_rate: 0.0002 (pre-trening, backbone se trenira od Kinetics)
#   - num_epochs: 10 (kraće – samo nauči domenu, ne overfit)
#   - early_stopping_patience: 5
#   - freeze_early: false (pre-trening = fine-tune cijeli backbone)
#   - freeze_layer3: false
#   - no_ramp: true (TAU anotacije su binary, bez rampe)
# =============================================================================

# --- Putanje (relativno od 3D CNN/ foldera) ---
frames_root: "../../tau106k_eval/frames_224"
metadata_dir: "../../tau106k_pretrain"
annotations_dir: "../../tau106k_pretrain/annotations"
yolo_detections_dir: "../../tau106k_eval/yolo_detections_tau"

# Nema posebnih val/test splitova za pretrain – dataloader koristi train_split.txt
# metadata_train.json / metadata_val.json u tau106k_pretrain/

# --- Sekvence ---
seq_len: 24
stride: 1
stride_safe: 10              # Manji stride jer ima više normalnih scena
stride_danger: 5
danger_horizon: 8
no_ramp: true                # TAU anotacije nemaju rampu – binary signal
img_size: [112, 112]
orig_img_size: [1280, 720]

# --- 3D CNN Model ---
backbone_3d: r2plus1d_18
hidden_dim: 256
dropout: 0.3                 # Manji dropout – pre-trening na velikom datasetu
freeze_3d: false             # Pre-trening: fine-tune cijeli backbone
freeze_early: false          # fine-tune sve (backbone dolazi iz Kinetics)
freeze_layer3: false
use_grad_checkpoint: false

# --- Object Detection features ---
use_object_branch: true      # YOLO detekcije su dostupne
max_objects: 15
bbox_feat_dim: 64
category_embed_dim: 16
use_object_interaction: true
object_interaction_heads: 4
object_interaction_layers: 1

# --- Temporal Object Aggregation ---
obj_temporal_layers: 1
obj_temporal_dropout: 0.0
attention_heads: 4
use_causal_attention: true

# --- Optical Flow ---
use_optical_flow: false
optical_flow_dir: null
use_global_flow: false
flow_feat_dim: 128

# --- Focal Loss ---
use_focal_loss: true
focal_gamma: 1.0
focal_alpha: 0.6
label_smoothing: 0.02        # Manji label smoothing za pre-trening

# --- Temporal Auxiliary Loss ---
use_temporal_aux: true
temporal_aux_weight: 0.3

# --- Anti-overfitting ---
mixup_alpha: 0.0
ema_decay: 0.0
ema_start_epoch: 2

# --- Trening ---
num_epochs: 10               # Kraće – samo domain adaptation
batch_size: 48               # Veći batch (više podataka)
val_batch_size: 32
gradient_accumulation_steps: 1  # efektivni batch = 48
learning_rate: 0.0002        # Malo veći LR za pre-trening
cnn_lr_factor: 0.5           # backbone LR = base * 0.5 (ne pretreniramo od nule)
weight_decay: 0.01
early_stopping_patience: 5
num_workers: 4
val_num_workers: 2
persistent_workers: true
prefetch_factor: 2
warmup_epochs: 1

# --- SWA ---
swa_start_epoch: 0           # Isključeno

# --- Cosine scheduler ---
cosine_T0: 5
cosine_T_mult: 2

# --- Checkpoint ---
# Nakon pre-treninga, backbone težine se automatski sprema u:
#   checkpoints/tau_pretrain_backbone.pt
# Koristi se u DoTA fine-tune konfiguraciji:
#   pretrained_backbone: "../../3D CNN/checkpoints/tau_pretrain_backbone.pt"
save_backbone_only: true     # Sprema samo backbone za lakše učitavanje
