# =============================================================================
# Konfiguracija za 3D CNN model – next-frame predviđanje opasnosti
# Backbone: R(2+1)D-18 pretrained na Kinetics-400
#
# v12 (RTX 5090, 34GB VRAM):
#   Hardware: batch 32, workers 8, no grad_checkpoint, val_batch 64
#   img_size 160×160 (više prostornog detalja, frames_224 ima 224px)
#   EMA solo (bez mixup – EMA+mixup bio loš u v3-v5)
#   Dropout 0.6 + weight_decay 0.05 (jača regularizacija)
#   cosine_T0 5 (brži restart LR ciklusa, spriječava duboki overfit na kraju ciklusa)
#   SWA od epohe 3 (averagira modele iz stabilne zone – implementirano u train_3d.py)
# =============================================================================

# --- Putanje do podataka (relativno od 3D CNN/ foldera) ---
frames_root: "../../dataset/frames_224"
viz_frames_root: "../../dataset/frames"
metadata_dir: "../../dataset"
annotations_dir: "../../dataset/annotations"
yolo_detections_dir: "../yolo_detections_v26x"

# --- Sekvence ---
seq_len: 24                  # 24 frameova konteksta (2.4s @ 10fps)
stride: 1                    # Default stride (za val/test)
stride_safe: 12              # Hybrid: stride u sigurnoj zoni (train only)
stride_danger: 8             # Hybrid: stride u danger/anomaly zoni
danger_horizon: 8            # Linearna rampa: 8 frameova (0.8s) prije anomalije
img_size: [160, 160]         # v12: 160×160 – više prostornog detalja (frames_224 ima 224px)
orig_img_size: [1280, 720]   # Originalna rezolucija videa (za normalizaciju bboxova)

# --- 3D CNN Model ---
backbone_3d: r2plus1d_18     # R(2+1)D-18: factorizirane 3D konvolucije (prostorne + temporalne)
                              # Opcije: r2plus1d_18, r3d_18, mc3_18
hidden_dim: 256              # Dimenzija skrivenog sloja
dropout: 0.6                 # v12: 0.6 (bez mixup+EMA – solo dropout jači)
freeze_3d: false             # false = fine-tune layer3+layer4 (freeze_early=true)
freeze_early: true           # Zamrzni stem + layer1 + layer2
use_grad_checkpoint: false   # v12: false – RTX 5090 ima 34GB, ne treba checkpoint

# --- Object Detection features ---
use_object_branch: true      # Koristi bbox + category features
max_objects: 15              # Maksimalan broj objekata po frameu
bbox_feat_dim: 64            # Dimenzija numeričkih bbox feature vektora
category_embed_dim: 16       # Dimenzija category embeddinga
use_object_interaction: true # Self-attention između objekata u frameu
object_interaction_heads: 4  # Broj attention glava za interakciju
object_interaction_layers: 1 # Broj slojeva interakcije

# --- Temporal Object Aggregation ---
obj_temporal_layers: 1       # LSTM slojevi za temporalnu agregaciju objekata
obj_temporal_dropout: 0.0    # Dropout za LSTM (koristi se samo ako layers > 1)
attention_heads: 4           # Broj attention glava za temporalnu attention
use_causal_attention: true   # Kauzalna attention (ne gleda budućnost)

# --- Optical Flow (opcionalno – 3D CNN već modelira motion) ---
use_optical_flow: false      # Isključeno – 3D CNN inherentno modelira kretanje
optical_flow_dir: "../flow_hd"
use_global_flow: false
flow_feat_dim: 128

# --- Focal Loss ---
use_focal_loss: true
focal_gamma: 1.0
focal_alpha: 0.6
label_smoothing: 0.05        # 0.05 – v10 pokazao da 0.1 škodi

# --- Anti-overfitting ---
mixup_alpha: 0.0             # Isključeno – s EMA-om daje lošije rezultate (v3-v5)
ema_decay: 0.999             # v12: EMA solo (bez mixup), nikad probano samo
ema_start_epoch: 2

# --- Trening ---
num_epochs: 20               # Više prostora za SWA
batch_size: 32               # v12: dvostruko (RTX 5090, 34GB VRAM)
val_batch_size: 32           # Windows paging file limit (64 × 24×3×160×160 previše workers)
gradient_accumulation_steps: 2  # v12: efektivni batch = 32 * 2 = 64 (isti kao prije)
learning_rate: 0.0001
cnn_lr_factor: 0.1           # 3D backbone LR = base_lr * 0.1
weight_decay: 0.05           # v12: jača regularizacija (0.02 → 0.05)
early_stopping_patience: 7
num_workers: 4               # Windows shared memory limit (error 1455 s >4 workers @ 160px)
val_num_workers: 2           # Val: manji workers – veliki tenzori (24×3×160×160) troše paging file
persistent_workers: true
prefetch_factor: 2
warmup_epochs: 2

# --- SWA (Stochastic Weight Averaging) ---
# Averagira težine modela iz više epoha → šira minimalna dolina → bolji val AUC
# Implementirano u train_3d.py pomoću torch.optim.swa_utils
swa_start_epoch: 3           # v12: aktivno od epohe 3 (kada model već dobro trenira)
swa_lr: 0.00005              # Konstantan LR tijekom SWA faze

# --- Cosine scheduler ---
cosine_T0: 5                 # v12: kraći ciklus (restart LR svakih 5 epoha, sprječava duboki overfit)
cosine_T_mult: 2
