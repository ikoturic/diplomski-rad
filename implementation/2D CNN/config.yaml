focal_gamma: 1.0
focal_alpha: 0.6
label_smoothing: 0.05
num_epochs: 20
batch_size: 96
val_batch_size: 128
learning_rate: 0.00022
weight_decay: 0.02
early_stopping_patience: 5
num_workers: 4
val_num_workers: 0
persistent_workers: true
prefetch_factor: 4
swa_start_epoch: 0
swa_lr: 0.00015
mixup_alpha: 0.2
cosine_T0: 20
cosine_T_mult: 1
warmup_epochs: 2
