frames_root: "../dataset/frames_224"
viz_frames_root: "../dataset/frames"
metadata_dir: "../dataset"
annotations_dir: "../dataset/annotations"
yolo_detections_dir: "yolo_detections_v26x"
seq_len: 24
stride: 1
stride_safe: 12
stride_danger: 8
danger_horizon: 8
img_size: [224, 224]
orig_img_size: [1280, 720]
hidden_dim: 256
lstm_layers: 2
dropout: 0.5
lstm_dropout: 0.3
freeze_cnn: true
cnn_lr_factor: 0.1
use_attention: true
attention_heads: 4
use_causal_attention: true
pretrained_backbone: "checkpoints/tau_pretrain_2d/tau_pretrain_backbone.pt"
max_objects: 15
roi_output_size: 3
roi_feat_dim: 128
bbox_feat_dim: 64
category_embed_dim: 16
use_optical_flow: true
